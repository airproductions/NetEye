name: Release

# Push a tag like v1.0.0 to build NetEye, run the tests, make the installer and a portable zip,
# and attach both to a GitHub release. "Run workflow" builds the same files as an artifact only.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --release

      - name: Build
        run: cargo build --release

      - name: Installer and portable zip
        shell: pwsh
        run: |
          $v = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '0.0.0-dev' }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc /Q "/DAppVersion=$v" "/DSourceExe=..\target\release\neteye.exe" installer\neteye.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $p = "dist\portable"
          New-Item -ItemType Directory -Force $p | Out-Null
          Copy-Item target\release\neteye.exe, LICENSE, README.md $p
          Copy-Item assets\geo\DBIP-LICENSE.txt "$p\DB-IP LICENSE.txt"
          Copy-Item assets\flags\LICENSE "$p\flag-icons LICENSE.txt"
          Copy-Item assets\fonts\OFL.txt "$p\Manrope OFL.txt"
          Compress-Archive -Path "$p\*" -DestinationPath "dist\NetEye-$v-portable.zip"
          Get-FileHash dist\*.exe, dist\*.zip -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Out-File -Encoding ascii dist\SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: NetEye-windows
          path: |
            dist/*.exe
            dist/*.zip
            dist/SHA256SUMS.txt

      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.zip
            dist/SHA256SUMS.txt
          generate_release_notes: true
