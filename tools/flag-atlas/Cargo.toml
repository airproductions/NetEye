[package]
name = "flag-atlas"
version = "0.1.0"
edition = "2021"
publish = false
description = "Offline generator for assets/flags/atlas.png and index.txt (not part of the app build)"
license = "MIT"

# Standalone project: keeps it out of the app's build and lock file.
[workspace]

[dependencies]
# Flags contain no text or embedded images, so the font and raster-image features stay off.
resvg = { version = "0.49", default-features = false }
serde_json = "1"
