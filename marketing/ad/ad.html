<!doctype html>
<html><head><meta charset="utf-8"><title>NetEye ad</title>
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script src="timeline.js"></script>
<script>
// Deterministic 15 s ad: render(t) draws the frame at time t (seconds). render.js steps it frame by frame.
const W = 1920, H = 1080;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const C = { bg0: '#0f1115', bg1: '#191d25', card: '#1a1e26', card2: '#222731', line: '#2b303b', text: '#e9ecf2', muted: '#8d95a5', dim: '#5c6370',
  teal: '#2dd4bf', violet: '#d08bfa', blue: '#3d7bff', red: '#f87171', amber: '#fbbf24', green: '#4ade80' };
const F = 'Geist', FM = 'Geist Mono';
window.ready = (async () => {
  for (const [name, file] of [[F, 'Geist'], [FM, 'GeistMono']])
    document.fonts.add(await new FontFace(name, `url(fonts/${file}.ttf)`, { weight: '100 900' }).load());
  return true;
})();

// ---- helpers
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, x) => a + (b - a) * x;
const outExpo = x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x);
const outCubic = x => 1 - Math.pow(1 - x, 3);
const inCubic = x => x * x * x;
const inOut = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const outBack = x => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
function rgba(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${n >> 8 & 255},${n & 255},${a})`; }
function mix(h1, h2, x) {
  const a = parseInt(h1.slice(1), 16), b = parseInt(h2.slice(1), 16);
  const ch = s => Math.round(lerp(a >> s & 255, b >> s & 255, x));
  return `rgb(${ch(16)},${ch(8)},${ch(0)})`;
}
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function font(size, weight = 700, ls = 0, fam = F) { ctx.font = `${weight} ${size}px "${fam}"`; ctx.letterSpacing = `${ls}px`; }
function text(s, x, y, size, color, weight = 700, align = 'left', ls = 0, fam = F) {
  font(size, weight, ls, fam); ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = 'alphabetic'; ctx.fillText(s, x, y);
}
function tw(s, size, weight = 700, ls = 0, fam = F) { font(size, weight, ls, fam); return ctx.measureText(s).width; }
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
// draw fn inside a transformed, faded, optionally blurred layer
function layer(o, fn) {
  if ((o.alpha ?? 1) <= 0.001) return;
  ctx.save();
  ctx.globalAlpha *= o.alpha ?? 1;
  const s = o.scale ?? 1, cx = o.cx ?? W / 2, cy = o.cy ?? H / 2;
  ctx.translate(cx + (o.dx ?? 0), cy + (o.dy ?? 0)); ctx.scale(s, s); ctx.translate(-cx, -cy);
  if (o.blur > 0.3) ctx.filter = `blur(${o.blur.toFixed(1)}px)`;
  fn(); ctx.restore();
}

// ---- brand pieces
function logo(cx, cy, size, open = 1, pupil = 1, glow = 0) {
  const k = size / 160, x0 = cx - size / 2, y0 = cy - size / 2;
  ctx.save();
  if (glow > 0) { ctx.shadowColor = rgba(C.teal, .55 * glow); ctx.shadowBlur = 90 * k * glow; }
  const g = ctx.createLinearGradient(x0, y0, x0 + size, y0 + size);
  g.addColorStop(0, '#3d7bff'); g.addColorStop(1, '#14c8b4');
  rr(x0, y0, size, size, size * .22); ctx.fillStyle = g; ctx.fill();
  ctx.restore();
  // almond: two circular arcs (r 54.4) meeting at x 32 and 128 of a 160 tile, squashed vertically by `open`
  const pts = [];
  for (let i = 0; i <= 40; i++) { const x = 32 + 96 * i / 40; pts.push([x, -(Math.sqrt(54.4 ** 2 - (x - 80) ** 2) - 25.6) * open]); }
  ctx.beginPath();
  pts.forEach(([x, y], i) => i ? ctx.lineTo(x0 + x * k, cy + y * k) : ctx.moveTo(x0 + x * k, cy + y * k));
  for (let i = pts.length - 1; i >= 0; i--) ctx.lineTo(x0 + pts[i][0] * k, cy - pts[i][1] * k);
  ctx.closePath();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 16 * k; ctx.lineJoin = 'round'; ctx.stroke();
  const pr = 16 * k * Math.min(pupil, clamp(open * 1.6));
  if (pr > .2) { ctx.beginPath(); ctx.arc(cx, cy, pr, 0, 7); ctx.fillStyle = '#fff'; ctx.fill(); }
}
function appIcon(x, y, s, c1, c2, letter) {
  const g = ctx.createLinearGradient(x, y, x + s, y + s); g.addColorStop(0, c1); g.addColorStop(1, c2);
  rr(x, y, s, s, s * .26); ctx.fillStyle = g; ctx.fill();
  text(letter, x + s / 2, y + s * .7, s * .55, '#fff', 700, 'center');
}
function shield(cx, cy, s, color, fill) {
  ctx.beginPath();
  ctx.moveTo(cx, cy - s); ctx.lineTo(cx + s * .82, cy - s * .62); ctx.lineTo(cx + s * .82, cy - s * .02);
  ctx.bezierCurveTo(cx + s * .82, cy + s * .55, cx + s * .4, cy + s * .85, cx, cy + s);
  ctx.bezierCurveTo(cx - s * .4, cy + s * .85, cx - s * .82, cy + s * .55, cx - s * .82, cy - s * .02);
  ctx.lineTo(cx - s * .82, cy - s * .62); ctx.closePath();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  ctx.strokeStyle = color; ctx.lineWidth = s * .16; ctx.lineJoin = 'round'; ctx.stroke();
}
function bell(cx, cy, s, color, ang) {
  ctx.save(); ctx.translate(cx, cy - s * .9); ctx.rotate(ang); ctx.translate(0, s * .9);
  ctx.beginPath();
  ctx.moveTo(-s * .8, s * .45); ctx.quadraticCurveTo(-s * .62, s * .2, -s * .62, -s * .15);
  ctx.bezierCurveTo(-s * .62, -s * .8, s * .62, -s * .8, s * .62, -s * .15);
  ctx.quadraticCurveTo(s * .62, s * .2, s * .8, s * .45); ctx.closePath();
  ctx.fillStyle = color; ctx.fill();
  ctx.beginPath(); ctx.arc(0, s * .62, s * .18, 0, 7); ctx.fill();
  ctx.restore();
}
function cursor(x, y, s) {
  const P = [[0, 0], [0, 26], [7, 20], [12, 31], [16.5, 29], [11.5, 18.5], [20, 18.5]];
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.shadowColor = 'rgba(0,0,0,.5)'; ctx.shadowBlur = 8; ctx.shadowOffsetY = 2;
  ctx.beginPath(); P.forEach(([a, b], i) => i ? ctx.lineTo(a, b) : ctx.moveTo(a, b)); ctx.closePath();
  ctx.fillStyle = '#fff'; ctx.fill(); ctx.shadowColor = 'transparent';
  ctx.strokeStyle = '#111'; ctx.lineWidth = 1.6; ctx.lineJoin = 'round'; ctx.stroke(); ctx.restore();
}
function card(x, y, w, h) {
  ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.55)'; ctx.shadowBlur = 90; ctx.shadowOffsetY = 30;
  rr(x, y, w, h, 24); ctx.fillStyle = C.card; ctx.fill(); ctx.restore();
  const g = ctx.createLinearGradient(x, y, x, y + h); g.addColorStop(0, 'rgba(255,255,255,.10)'); g.addColorStop(1, 'rgba(255,255,255,.03)');
  rr(x + .5, y + .5, w - 1, h - 1, 24); ctx.strokeStyle = g; ctx.lineWidth = 1.5; ctx.stroke();
}
function windowBar(x, y, w, active) {
  logo(x + 42, y + 38, 34);
  text('NetEye', x + 70, y + 46, 22, C.text, 700);
  const tabs = ['Traffic', 'Firewall', 'Activity', 'Scanner'];
  let tx = x + 200;
  tabs.forEach(n => {
    const ww = tw(n, 18, 600) + 32;
    if (n === active) { rr(tx, y + 20, ww, 36, 10); ctx.fillStyle = rgba(C.blue, .2); ctx.fill(); }
    text(n, tx + 16, y + 44, 18, n === active ? '#9dbcff' : C.muted, 600);
    tx += ww + 6;
  });
  ctx.beginPath(); ctx.arc(x + w - 110, y + 38, 6, 0, 7); ctx.fillStyle = C.green; ctx.fill();
  text('Online', x + w - 96, y + 45, 18, C.muted, 600);
  ctx.fillStyle = C.line; ctx.fillRect(x, y + 76, w, 1.5);
}

// ---- headline block (mono section label, two masked lines, subline)
function headline(t, t0, x, y, num, name, l1, l2, sub, accent) {
  const e = d => outExpo(prog(t, t0 + d, t0 + d + .7));
  // section label: "01 ——— TRAFFIC MONITOR", the rule draws in between number and name
  const label = name.toUpperCase();
  layer({ alpha: e(0) }, () => text(num, x, y + 30, 24, accent[0], 500, 'left', 1, FM));
  const lw = 64 * e(.05);
  ctx.save(); ctx.globalAlpha *= .8; ctx.fillStyle = accent[0]; ctx.fillRect(x + 46, y + 21, lw, 2); ctx.restore();
  layer({ alpha: e(.12), dx: (1 - e(.12)) * -16 }, () => text(label, x + 128, y + 30, 21, C.muted, 400, 'left', 4, FM));
  const line = (s, ly, d, grad) => {
    const p = e(d);
    ctx.save(); ctx.beginPath(); ctx.rect(x - 20, ly - 110, 1000, 140); ctx.clip();
    const yy = ly + (1 - p) * 125;
    if (grad) {
      const w = tw(s, 116, 600, -4.5), g = ctx.createLinearGradient(x, 0, x + w, 0);
      g.addColorStop(0, accent[0]); g.addColorStop(1, accent[1]);
      text(s, x, yy, 116, g, 600, 'left', -4.5);
    } else text(s, x, yy, 116, C.text, 600, 'left', -4.5);
    ctx.restore();
  };
  line(l1, y + 170, .08, false);
  line(l2, y + 290, .16, true);
  layer({ alpha: e(.3), dy: (1 - e(.3)) * 20 }, () => text(sub, x + 4, y + 365, 34, C.muted, 400));
}

// ---- background
const R = rng(7), dots = Array.from({ length: 90 }, () => ({ x: R() * W, y: R() * H, s: .6 + R() * 1.8, v: 6 + R() * 18, p: R() * 6.28 }));
function background(t) {
  const g = ctx.createLinearGradient(0, 0, W, H); g.addColorStop(0, C.bg0); g.addColorStop(1, C.bg1);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // drifting grid
  ctx.strokeStyle = 'rgba(255,255,255,.035)'; ctx.lineWidth = 1;
  const off = (t * 14) % 64;
  ctx.beginPath();
  for (let x = -64 + off; x < W + 64; x += 64) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
  for (let y = -64 + off * .5; y < H + 64; y += 64) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
  ctx.stroke();
  // glows; the accent hue follows the scene
  const glow = (x, y, r, col, a) => { const rg = ctx.createRadialGradient(x, y, 0, x, y, r);
    rg.addColorStop(0, rgba(col, a)); rg.addColorStop(1, rgba(col, 0)); ctx.fillStyle = rg; ctx.fillRect(0, 0, W, H); };
  glow(420 + Math.sin(t * .5) * 120, 300 + Math.cos(t * .4) * 60, 900, C.teal, .10);
  glow(1500 + Math.cos(t * .45) * 120, 820, 950, C.violet, .085);
  const hero = Math.max(1 - prog(t, 1.6, 2.2), prog(t, 11.8, 12.6));
  if (hero > 0) glow(W / 2, H / 2 - 40, 700, C.blue, .16 * hero);
  for (const d of dots) {
    const y = ((d.y - t * d.v) % H + H) % H, a = .15 + .25 * (0.5 + 0.5 * Math.sin(t * 2 + d.p));
    ctx.beginPath(); ctx.arc(d.x, y, d.s, 0, 7); ctx.fillStyle = `rgba(200,225,255,${a})`; ctx.fill();
  }
}
function vignette() {
  const g = ctx.createRadialGradient(W / 2, H / 2, H * .35, W / 2, H / 2, H * 1.05);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.6)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}
// light streak that sweeps across at each cut
function streak(t) {
  for (const c of [2.0, 5.5, 9.0, 12.0]) {
    const p = prog(t, c - .14, c + .2); if (p <= 0 || p >= 1) continue;
    const x = lerp(-400, W + 400, inOut(p));
    const g = ctx.createLinearGradient(x - 260, 0, x + 260, 0);
    g.addColorStop(0, 'rgba(120,230,255,0)'); g.addColorStop(.5, `rgba(150,235,255,${.16 * Math.sin(p * Math.PI)})`); g.addColorStop(1, 'rgba(120,230,255,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
}
// scene envelope: enter (expo in from the side), exit (accelerate out, blur)
function env(t, a, b, dir = 1) {
  const i = outExpo(prog(t, a, a + .75)), o = inCubic(prog(t, b - .3, b));
  return { alpha: Math.min(i, 1 - o), dx: (1 - i) * 140 * dir - o * 160, blur: (1 - i) * 10 + o * 14 };
}

// ---- scene 0: logo reveal (0 - 2 s)
function scene0(t) {
  const out = inCubic(prog(t, 1.7, 2.02));
  layer({ alpha: 1 - out, scale: 1 + out * .28, blur: out * 16 }, () => {
    const pop = outBack(prog(t, .05, .6)), open = outBack(prog(t, .35, .75)), pupil = outBack(prog(t, .55, .85));
    const slide = outExpo(prog(t, .85, 1.45));
    const wordW = tw('NetEye', 132, 600, -4), size = 168, gap = 40;
    const groupW = size + gap + wordW, cx = lerp(W / 2, W / 2 - groupW / 2 + size / 2, slide), cy = 470;
    layer({ alpha: prog(t, .05, .3), scale: lerp(.55, 1, pop), cx, cy }, () => logo(cx, cy, size, Math.max(.06, open), pupil, 1 - prog(t, .9, 1.6) * .6));
    const wx = cx + size / 2 + gap;
    const wipe = outExpo(prog(t, .95, 1.55));
    if (wipe > 0) {
      ctx.save(); ctx.beginPath(); ctx.rect(wx - 10, cy - 120, (wordW + 40) * wipe, 200); ctx.clip();
      ctx.globalAlpha *= prog(t, .95, 1.2);
      text('NetEye', wx - (1 - wipe) * 60, cy + 46, 132, C.text, 600, 'left', -4);
      ctx.restore();
    }
    // ring pulse when the pupil pops
    const rp = prog(t, .6, 1.3);
    if (rp > 0 && rp < 1) { ctx.beginPath(); ctx.arc(cx, cy, size * .6 + rp * 220, 0, 7); ctx.strokeStyle = rgba(C.teal, .5 * (1 - rp)); ctx.lineWidth = 3; ctx.stroke(); }
    const tg = outExpo(prog(t, 1.2, 1.8));
    layer({ alpha: tg, dy: (1 - tg) * 24 }, () => text('See every connection.', W / 2, 680, 44, C.muted, 600, 'center', -1));
  });
}

// ---- scene 1: monitor your traffic (2 - 5.5 s)
const apps1 = [
  ['Steam', '#1b6fb3', '#66c0f4', 'S', 2.4], ['Firefox', '#ff9500', '#e31587', 'F', 1.3],
  ['Discord', '#5865f2', '#8b93ff', 'D', .62], ['Spotify', '#1db954', '#14853d', 'S', .34]];
const spike = (u, c, w) => Math.exp(-(((u - c) / w) ** 2));
const down = u => .26 + .07 * Math.sin(1.7 * u) + .05 * Math.sin(3.1 * u + 1) + .035 * Math.sin(7.3 * u) + .55 * spike(u, 3.85, .2);
const up = u => .11 + .035 * Math.sin(2.3 * u + 2) + .025 * Math.sin(5.1 * u) + .2 * spike(u, 3.9, .22);
function fmt(mb) { return mb >= 1 ? mb.toFixed(1) + ' MB/s' : Math.round(mb * 1000) + ' KB/s'; }
function scene1(t) {
  const e = env(t, 1.95, 5.5);
  layer(e, () => {
    headline(t, 2.0, 150, 300, '01', 'Traffic monitor', 'Monitor your', 'traffic', 'Every app. Every byte. Live.', [C.teal, '#5eead4']);
    const ci = outExpo(prog(t, 2.05, 2.85)), push = 1 + prog(t, 2, 5.5) * .035;
    layer({ alpha: ci, dx: (1 - ci) * 160, scale: push, cx: 1330, cy: 540 }, () => {
      const x = 880, y = 140, w = 900, h = 800;
      card(x, y, w, h); windowBar(x, y, w, 'Traffic');
      // graph
      const gx = x + 32, gy = y + 100, gw = w - 64, gh = 330;
      text('All traffic', gx, gy + 30, 24, C.text, 700);
      [[C.teal, 'Download'], [C.violet, 'Upload']].forEach(([c, n], i) => {
        const lx = gx + gw - 250 + i * 135; ctx.beginPath(); ctx.arc(lx, gy + 22, 6, 0, 7); ctx.fillStyle = c; ctx.fill();
        text(n, lx + 14, gy + 29, 18, C.muted, 600);
      });
      ctx.strokeStyle = 'rgba(255,255,255,.06)'; ctx.lineWidth = 1;
      for (let i = 0; i < 4; i++) { const yy = gy + 70 + i * 75; ctx.beginPath(); ctx.moveTo(gx, yy); ctx.lineTo(gx + gw, yy); ctx.stroke(); }
      const base = gy + gh, top = gy + 60, reveal = outCubic(prog(t, 2.2, 3.1)), span = 5;
      const X = i => gx + gw * i / 200, U = i => t - span + span * i / 200;
      ctx.save(); ctx.beginPath(); ctx.rect(gx, gy, gw * reveal, gh + 4); ctx.clip();
      for (const [f, col, a] of [[down, C.teal, .42], [up, C.violet, .36]]) {
        const Y = i => base - (base - top) * f(U(i));
        ctx.beginPath(); ctx.moveTo(X(0), base);
        for (let i = 0; i <= 200; i++) ctx.lineTo(X(i), Y(i));
        ctx.lineTo(X(200), base); ctx.closePath();
        const g = ctx.createLinearGradient(0, top, 0, base); g.addColorStop(0, rgba(col, a)); g.addColorStop(1, rgba(col, 0));
        ctx.fillStyle = g; ctx.fill();
        ctx.beginPath(); for (let i = 0; i <= 200; i++) ctx.lineTo(X(i), Y(i));
        ctx.strokeStyle = col; ctx.lineWidth = 3.5; ctx.lineJoin = 'round'; ctx.stroke();
      }
      ctx.restore();
      // live head dot
      if (reveal >= 1) {
        const hy = base - (base - top) * down(t), pr = (t * 1.5) % 1;
        ctx.beginPath(); ctx.arc(gx + gw, hy, 7, 0, 7); ctx.fillStyle = C.teal; ctx.fill();
        ctx.beginPath(); ctx.arc(gx + gw, hy, 7 + pr * 18, 0, 7); ctx.strokeStyle = rgba(C.teal, .6 * (1 - pr)); ctx.lineWidth = 2; ctx.stroke();
      }
      // tooltip riding the spike
      const tp = outBack(prog(t, CUES.tooltip, CUES.tooltip + .35));
      if (tp > 0) {
        const px = gx + gw * (3.85 - (t - span)) / span, py = base - (base - top) * down(3.85);
        layer({ alpha: clamp(tp), scale: lerp(.6, 1, tp), cx: px, cy: py - 40 }, () => {
          ctx.beginPath(); ctx.arc(px, py, 8, 0, 7); ctx.fillStyle = '#fff'; ctx.fill();
          const bw = 250, bx = px - bw - 22, by = py - 34;
          rr(bx, by, bw, 64, 14); ctx.fillStyle = '#2a303c'; ctx.fill(); ctx.strokeStyle = rgba(C.teal, .5); ctx.lineWidth = 1.5; ctx.stroke();
          appIcon(bx + 14, by + 14, 36, '#1b6fb3', '#66c0f4', 'S');
          text('Steam', bx + 62, by + 30, 18, C.text, 700);
          text('↓ 48.2 MB/s', bx + 62, by + 52, 17, C.teal, 600);
        });
      }
      // app rows
      const ry = gy + gh + 34;
      text('App', gx, ry + 10, 17, C.dim, 600); text('Download', gx + gw, ry + 10, 17, C.dim, 600, 'right');
      apps1.forEach(([n, c1, c2, l, v], i) => {
        const [r0, rs] = CUES.trafficRows, ri = outExpo(prog(t, r0 + i * rs, r0 + .75 + i * rs)), yy = ry + 30 + i * 66;
        layer({ alpha: ri, dx: (1 - ri) * 60 }, () => {
          if (i % 2 === 0) { rr(gx - 12, yy, gw + 24, 58, 12); ctx.fillStyle = 'rgba(255,255,255,.025)'; ctx.fill(); }
          appIcon(gx, yy + 10, 38, c1, c2, l);
          text(n, gx + 56, yy + 38, 23, C.text, 600);
          const live = v * (1 + .12 * Math.sin(t * 5 + i * 2)) + (i === 0 ? 45.8 * spike(t, 4.4, .55) : 0);
          const frac = clamp(live / 50 * .7 + .08 * (4 - i)) * ri;
          rr(gx + 320, yy + 25, 320, 8, 4); ctx.fillStyle = 'rgba(255,255,255,.06)'; ctx.fill();
          const g = ctx.createLinearGradient(gx + 320, 0, gx + 640, 0); g.addColorStop(0, C.teal); g.addColorStop(1, '#5eead4');
          rr(gx + 320, yy + 25, Math.max(8, 320 * frac), 8, 4); ctx.fillStyle = g; ctx.fill();
          text(fmt(live * ri), gx + gw, yy + 38, 22, C.text, 600, 'right');
        });
      });
    });
  });
}

// ---- scene 2: custom firewall (5.5 - 9 s)
const apps2 = [['Firefox', 'Mozilla Corporation', '#ff9500', '#e31587', 'F'], ['Steam', 'Valve Corporation', '#1b6fb3', '#66c0f4', 'S'],
  ['Discord', 'Discord Inc.', '#5865f2', '#8b93ff', 'D'], ['Spotify', 'Spotify AB', '#1db954', '#14853d', 'S'], ['updater.exe', 'Unknown publisher', '#6b7280', '#4b5563', 'U']];
function scene2(t) {
  const e = env(t, 5.36, 9.0, -1);
  layer(e, () => {
    headline(t, 5.4, 1090, 300, '02', 'Firewall', 'Custom', 'firewall', 'Block any app in one click.', [C.violet, '#a78bfa']);
    const ci = outExpo(prog(t, 5.4, 6.2)), push = 1 + prog(t, 5.5, 9) * .035;
    const x = 140, y = 150, w = 860, h = 780;
    layer({ alpha: ci, dx: -(1 - ci) * 160, scale: push, cx: 570, cy: 540 }, () => {
      card(x, y, w, h); windowBar(x, y, w, 'Firewall');
      const clickT = CUES.click, blocked = t >= clickT, bp = outExpo(prog(t, clickT, clickT + .35));
      // header stats
      shield(x + 52, y + 132, 20, C.teal, rgba(C.teal, .12));
      text('Firewall rules', x + 86, y + 142, 26, C.text, 700);
      rr(x + 290, y + 116, 70, 34, 17); ctx.fillStyle = rgba(C.green, .18); ctx.fill();
      ctx.beginPath(); ctx.arc(x + 343, y + 133, 12, 0, 7); ctx.fillStyle = C.green; ctx.fill();
      text('Blocked apps', x + w - 190, y + 128, 17, C.muted, 600);
      const pulse = blocked ? 1 + .35 * Math.sin(Math.PI * prog(t, clickT, clickT + .3)) : 1;
      layer({ scale: pulse, cx: x + w - 190, cy: y + 150 }, () => text(blocked ? '1' : '0', x + w - 190, y + 160, 30, blocked ? C.red : C.text, 700));
      const hy = y + 196;
      text('App', x + 32, hy, 17, C.dim, 600); text('Publisher', x + 340, hy, 17, C.dim, 600); text('Outgoing', x + w - 120, hy, 17, C.dim, 600, 'center');
      apps2.forEach(([n, pub, c1, c2, l], i) => {
        const [r0, rs] = CUES.firewallRows, ri = outExpo(prog(t, r0 + i * rs, r0 + .7 + i * rs)), yy = hy + 22 + i * 92, last = i === 4;
        layer({ alpha: ri, dx: -(1 - ri) * 50 }, () => {
          const hover = last ? prog(t, 6.55, 6.8) : 0;
          rr(x + 16, yy, w - 32, 80, 14);
          ctx.fillStyle = last && blocked ? rgba(C.red, .07 * bp + .03) : `rgba(255,255,255,${.022 + hover * .03})`; ctx.fill();
          if (last && blocked) { rr(x + 16, yy + 14, 5, 52 * bp, 3); ctx.fillStyle = C.red; ctx.fill(); }
          appIcon(x + 36, yy + 19, 42, c1, c2, l);
          text(n, x + 96, yy + 50, 24, C.text, 600);
          if (last) { text('⚠', x + 340, yy + 50, 20, C.amber, 700); text(pub, x + 368, yy + 50, 20, C.amber, 600); }
          else text(pub, x + 340, yy + 50, 20, C.muted, 400);
          // Allowed -> Blocked pill
          const px = x + w - 190, py = yy + 20, pw = 140, ph = 40;
          const press = last ? 1 - .1 * Math.sin(Math.PI * prog(t, clickT - .06, clickT + .1)) : 1;
          layer({ scale: press, cx: px + pw / 2, cy: py + ph / 2 }, () => {
            const col = last ? mix(C.teal, C.red, bp) : C.teal;
            rr(px, py, pw, ph, 20); ctx.fillStyle = last ? (bp > .5 ? rgba(C.red, .16) : rgba(C.teal, .12)) : rgba(C.teal, .12); ctx.fill();
            ctx.strokeStyle = last ? (bp > .5 ? rgba(C.red, .45) : rgba(C.teal, .3)) : rgba(C.teal, .3); ctx.lineWidth = 1.5; ctx.stroke();
            text(last && blocked ? 'Blocked' : 'Allowed', px + pw / 2, py + 27, 19, col, 700, 'center');
          });
          if (last) {
            const rp = prog(t, clickT, clickT + .55);
            if (rp > 0 && rp < 1) { rr(px - rp * 30, py - rp * 30, pw + rp * 60, ph + rp * 60, 20 + rp * 30); ctx.strokeStyle = rgba(C.red, .6 * (1 - rp)); ctx.lineWidth = 3; ctx.stroke(); }
          }
        });
      });
      // toast
      const to = outBack(prog(t, CUES.toast, CUES.toast + .45)), tOut = prog(t, 8.6, 8.9);
      if (to > 0) layer({ alpha: clamp(to) * (1 - tOut), dy: (1 - to) * -40, scale: lerp(.9, 1, clamp(to)), cx: x + w / 2, cy: y + h - 60 }, () => {
        const bw = 470, bx = x + w / 2 - bw / 2, by = y + h - 104;
        ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.5)'; ctx.shadowBlur = 40;
        rr(bx, by, bw, 76, 18); ctx.fillStyle = '#2a2f3a'; ctx.fill(); ctx.restore();
        rr(bx, by, bw, 76, 18); ctx.strokeStyle = rgba(C.red, .45); ctx.lineWidth = 1.5; ctx.stroke();
        shield(bx + 42, by + 38, 17, C.red, rgba(C.red, .15));
        text('updater.exe blocked', bx + 76, by + 34, 22, C.text, 700);
        text('All outgoing connections denied', bx + 76, by + 60, 17, C.muted, 400);
      });
      // cursor glides to the pill and clicks
      const cm = inOut(prog(t, 6.1, 6.9)), cx0 = x + w + 260, cy0 = y + h + 80, tx = x + w - 120, ty = hy + 22 + 4 * 92 + 44;
      const ca = prog(t, 5.95, 6.2) * (1 - prog(t, 8.2, 8.5));
      if (ca > 0) layer({ alpha: ca }, () => cursor(lerp(cx0, tx, cm), lerp(cy0, ty, cm), 1.7 * (1 - .12 * Math.sin(Math.PI * prog(t, clickT - .06, clickT + .1)))));
    });
  });
}

// ---- scene 3: live activity log (9 - 12 s)
const events = [
  [C.teal, 'New app connected', 'Discord.exe  →  162.159.130.234', 'link'],
  [C.amber, 'New device on Wi-Fi', 'Pixel 8  ·  192.168.1.42', 'wifi'],
  [C.violet, 'Upload spike', 'OneDrive  ·  12.4 MB/s', 'up'],
  [C.blue, 'Camera in use', 'Zoom.exe turned on the webcam', 'cam'],
  [C.red, 'Connection blocked', 'updater.exe  →  45.133.1.20', 'block']];
const evT = k => CUES.events[0] + k * CUES.events[1];
function glyph(kind, cx, cy, col) {
  ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = 3.2; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath();
  if (kind === 'link') { ctx.arc(cx, cy, 11, 0, 7); ctx.moveTo(cx - 11, cy); ctx.lineTo(cx + 11, cy); ctx.moveTo(cx, cy - 11); ctx.bezierCurveTo(cx - 8, cy - 4, cx - 8, cy + 4, cx, cy + 11); ctx.moveTo(cx, cy - 11); ctx.bezierCurveTo(cx + 8, cy - 4, cx + 8, cy + 4, cx, cy + 11); ctx.stroke(); }
  else if (kind === 'wifi') { for (const r of [6, 12]) { ctx.moveTo(cx - r * .9, cy + 4 - r * .45); ctx.arc(cx, cy + 6, r, -2.4, -.74); } ctx.stroke(); ctx.beginPath(); ctx.arc(cx, cy + 7, 2.6, 0, 7); ctx.fill(); }
  else if (kind === 'down') { ctx.moveTo(cx, cy - 16); ctx.lineTo(cx, cy + 4); ctx.moveTo(cx - 8, cy - 4); ctx.lineTo(cx, cy + 5); ctx.lineTo(cx + 8, cy - 4); ctx.moveTo(cx - 12, cy + 13); ctx.lineTo(cx + 12, cy + 13); ctx.stroke(); }
  else if (kind === 'up') { ctx.moveTo(cx, cy + 11); ctx.lineTo(cx, cy - 10); ctx.moveTo(cx - 8, cy - 3); ctx.lineTo(cx, cy - 11); ctx.lineTo(cx + 8, cy - 3); ctx.stroke(); }
  else if (kind === 'cam') { ctx.roundRect(cx - 13, cy - 8, 18, 16, 4); ctx.moveTo(cx + 6, cy - 2); ctx.lineTo(cx + 13, cy - 7); ctx.lineTo(cx + 13, cy + 7); ctx.lineTo(cx + 6, cy + 2); ctx.stroke(); }
  else { ctx.arc(cx, cy, 11, 0, 7); ctx.moveTo(cx - 7.5, cy + 7.5); ctx.lineTo(cx + 7.5, cy - 7.5); ctx.stroke(); }
  ctx.lineCap = 'butt'; ctx.lineJoin = 'miter';
}
function scene3(t) {
  const out = inCubic(prog(t, 11.7, 12.02)), i = outExpo(prog(t, 8.86, 9.6));
  layer({ alpha: Math.min(i, 1 - out), dx: (1 - i) * 140, scale: 1 - out * .06, blur: (1 - i) * 10 + out * 14 }, () => {
    headline(t, 8.9, 150, 300, '03', 'Activity log', 'Live', 'activity log', 'Know the moment anything changes.', [C.amber, '#fb923c']);
    const ci = outExpo(prog(t, 8.95, 9.75)), push = 1 + prog(t, 9, 12) * .035;
    const x = 880, y = 140, w = 900, h = 800;
    layer({ alpha: ci, dx: (1 - ci) * 160, scale: push, cx: 1330, cy: 540 }, () => {
      card(x, y, w, h); windowBar(x, y, w, 'Activity');
      let n = 0, ring = 0;
      events.forEach((_, k) => { if (t >= evT(k)) n++; const d = t - evT(k); if (d >= 0 && d < .7) ring = Math.sin(d * 28) * .35 * (1 - d / .7); });
      bell(x + 52, y + 136, 20, C.text, ring);
      if (n > 0) { const bp = outBack(prog(t, evT(n - 1), evT(n - 1) + .25));
        layer({ scale: bp, cx: x + 66, cy: y + 116 }, () => { ctx.beginPath(); ctx.arc(x + 66, y + 116, 13, 0, 7); ctx.fillStyle = C.red; ctx.fill(); text(String(n), x + 66, y + 122, 16, '#fff', 700, 'center'); }); }
      text('Activity Log', x + 88, y + 146, 26, C.text, 700);
      let cx2 = x + w - 32;
      ['Security', 'Network', 'Apps', 'All'].forEach(s => { const ww = tw(s, 17, 600) + 28; cx2 -= ww;
        rr(cx2, y + 116, ww, 36, 18); ctx.fillStyle = s === 'All' ? rgba(C.blue, .2) : 'rgba(255,255,255,.04)'; ctx.fill();
        text(s, cx2 + 14, y + 140, 17, s === 'All' ? '#9dbcff' : C.muted, 600); cx2 -= 8; });
      ctx.save(); ctx.beginPath(); ctx.rect(x, y + 180, w, h - 190); ctx.clip();
      events.forEach(([col, title, detail, kind], k) => {
        const a = outBack(prog(t, evT(k), evT(k) + .45)); if (a <= 0) return;
        let slot = 0; for (let j = k + 1; j < events.length; j++) slot += outExpo(prog(t, evT(j), evT(j) + .45));
        const yy = y + 196 + slot * 116, fresh = 1 - prog(t, evT(k) + .2, evT(k) + 1.2);
        layer({ alpha: clamp(a), dx: (1 - clamp(a)) * 50, scale: lerp(.92, 1, a), cx: x + w / 2, cy: yy + 50 }, () => {
          rr(x + 24, yy, w - 48, 100, 16); ctx.fillStyle = 'rgba(255,255,255,.03)'; ctx.fill();
          if (fresh > 0) { ctx.fillStyle = rgba(col, .12 * fresh); ctx.fill(); ctx.strokeStyle = rgba(col, .5 * fresh); ctx.lineWidth = 1.5; ctx.stroke(); }
          ctx.beginPath(); ctx.arc(x + 80, yy + 50, 28, 0, 7); ctx.fillStyle = rgba(col, .16); ctx.fill();
          glyph(kind, x + 80, yy + 50, col);
          text(title, x + 128, yy + 44, 24, C.text, 700);
          text(detail, x + 128, yy + 76, 19, C.muted, 400);
          const ago = Math.floor(t - evT(k));
          text(ago < 1 ? 'now' : `${ago}s ago`, x + w - 48, yy + 44, 17, ago < 1 ? col : C.dim, 600, 'right');
        });
      });
      ctx.restore();
    });
  });
}

// ---- scene 4: end card (12 - 15 s)
function scene4(t) {
  const fade = 1 - prog(t, 14.7, 15.0);
  layer({ alpha: fade }, () => {
    const pop = outBack(prog(t, 12.0, 12.5)), size = 150, gap = 38, wordW = tw('NetEye', 124, 600, -4);
    const gw = size + gap + wordW, lx = W / 2 - gw / 2 + size / 2, cy = 400;
    const blink = t > 13.75 && t < 14.0 ? Math.abs(Math.cos((t - 13.75) / .25 * Math.PI)) : 1;
    const zoom = 1 + prog(t, 12, 15) * .03;
    layer({ scale: zoom }, () => {
      layer({ alpha: prog(t, 12, 12.2), scale: lerp(.5, 1, pop), cx: lx, cy }, () => logo(lx, cy, size, Math.max(.08, blink * outBack(prog(t, 12.15, 12.5))), 1, .7));
      const wr = outExpo(prog(t, 12.15, 12.8)), wx = lx + size / 2 + gap;
      ctx.save(); ctx.beginPath(); ctx.rect(wx - 10, cy - 110, wordW + 40, 190); ctx.clip();
      text('NetEye', wx - (1 - wr) * 80, cy + 44, 124, C.text, 600, 'left', -4); ctx.restore();
      const tg = outExpo(prog(t, 12.4, 13.0));
      layer({ alpha: tg, dy: (1 - tg) * 26 }, () => {
        const a = 'See every connection. ', b = 'Control every app.', wa = tw(a, 46, 600, -1), wb = tw(b, 46, 600, -1), sx = W / 2 - (wa + wb) / 2;
        text(a, sx, 600, 46, C.text, 600, 'left', -1);
        const g = ctx.createLinearGradient(sx + wa, 0, sx + wa + wb, 0); g.addColorStop(0, C.teal); g.addColorStop(1, '#60a5fa');
        text(b, sx + wa, 600, 46, g, 600, 'left', -1);
      });
      // hairline rule that draws out from the centre, with a light travelling along it
      const ln = outExpo(prog(t, 12.6, 13.3)), rw = 640 * ln;
      if (ln > 0) {
        const rg = ctx.createLinearGradient(W / 2 - 320, 0, W / 2 + 320, 0);
        rg.addColorStop(0, rgba(C.teal, 0)); rg.addColorStop(.5, rgba(C.teal, .7)); rg.addColorStop(1, rgba(C.blue, 0));
        ctx.fillStyle = rg; ctx.fillRect(W / 2 - rw / 2, 672, rw, 1.5);
        const sp = prog(t, CUES.ruleLight, CUES.ruleLight + .7);
        if (sp > 0 && sp < 1) { const sx = lerp(W / 2 - 300, W / 2 + 300, inOut(sp));
          ctx.save(); ctx.translate(sx, 672.75); ctx.scale(1, .12);
          const sg = ctx.createRadialGradient(0, 0, 0, 0, 0, 70);
          sg.addColorStop(0, `rgba(200,250,255,${Math.sin(sp * Math.PI)})`); sg.addColorStop(1, 'rgba(200,250,255,0)');
          ctx.fillStyle = sg; ctx.beginPath(); ctx.arc(0, 0, 70, 0, 7); ctx.fill(); ctx.restore(); }
      }
      // call to action: download glyph, "Free for Windows" | repo URL in mono
      const ca = outExpo(prog(t, 12.75, 13.35));
      layer({ alpha: ca, dy: (1 - ca) * 18 }, () => {
        const a = 'Free for Windows', b = 'github.com/airproductions/NetEye';
        const wa = tw(a, 34, 600, -.5), wb = tw(b, 24, 400, 0, FM), icon = 30, gap = 16, div = 56;
        const sx = W / 2 - (icon + gap + wa + div + wb) / 2, cyy = 748;
        glyph('down', sx + icon / 2, cyy, C.teal);
        text(a, sx + icon + gap, cyy + 11, 34, C.text, 600, 'left', -.5);
        const dx = sx + icon + gap + wa + div / 2; ctx.fillStyle = C.line; ctx.fillRect(dx, cyy - 18, 1.5, 36);
        text(b, dx + div / 2, cyy + 8, 24, C.muted, 400, 'left', 0, FM);
      });
    });
  });
}

function render(t) {
  ctx.save(); ctx.globalAlpha = 1; ctx.filter = 'none';
  background(t);
  if (t < 2.05) scene0(t);
  if (t > 1.9 && t < 5.55) scene1(t);
  if (t > 5.3 && t < 9.05) scene2(t);
  if (t > 8.8 && t < 12.05) scene3(t);
  if (t >= 11.95) scene4(t);
  streak(t); vignette();
  ctx.restore();
}
window.render = render;
window.ready.then(() => render(+(location.hash.slice(1) || 0)));
</script></body></html>
